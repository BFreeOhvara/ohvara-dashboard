# P1028: records the phone app's cold start on an iOS simulator and an Android emulator, light + dark,
# plus a reopen from the background. Lives in .github/workflows/ only on throwaway p1028-rec-* branches
# (each carries a prebuilt dist/), and commits the clips back to that branch under rec/.
name: p1028 boot record
on:
  push:
    branches: ['p1028-rec-*']
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx cap sync ios
      - run: sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = 99;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Record
        run: bash scripts/p1028/rec-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-rec, path: rec/ }
      - name: Commit the clips
        if: always()
        run: bash scripts/p1028/push-rec.sh ios
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --no-audit --no-fund
      - run: npx cap sync android
      - name: Build the apk
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug -PversionCode=99 --no-daemon -q
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Record
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/p1028/rec-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-rec, path: rec/ }
      - name: Commit the clips
        if: always()
        run: bash scripts/p1028/push-rec.sh android
