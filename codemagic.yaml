# Prompt 775 — cloud builds for the Ohvara phone app (Codemagic, free tier:
# a Mac in the cloud, so no Mac is needed here). Both workflows run on demand
# from the Codemagic dashboard ("Start new build"); nothing builds on push.
#
# Set up once in Codemagic (brain/App Store Launch Checklist.md has the clicks):
#   - Team integrations → App Store Connect → the API key, named "Ohvara ASC key"
#   - iOS signing is automatic (P951): environment group ohvara_ios with
#     CERTIFICATE_PRIVATE_KEY (secret). The certificate and the App Store profile
#     for com.ohvara.portal are fetched or created from Apple on every build; no
#     uploaded profile or certificate is used.
#   - Code signing identities → Android keystores: the upload keystore,
#     reference name "ohvara_upload"
#   - Environment groups:
#       ohvara_web   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (the public
#                    publishable key), VITE_PUBLIC_APP_URL=https://portal.ohvara.com
#       google_play  GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play service account
#                    JSON, secret), GOOGLE_SERVICES_JSON (Firebase Android file, secret)
# Keys and keystores live only in Codemagic. Never in git.

workflows:
  ios-testflight:
    name: iPhone → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Ohvara ASC key
    environment: &ios_env
      groups:
        - ohvara_web
        # P951: ohvara_ios holds CERTIFICATE_PRIVATE_KEY (secret), the private key
        # for the Apple Distribution certificate. With it every build fetches (or
        # creates) the certificate and the App Store profile straight from Apple,
        # so a capability ticked at developer.apple.com is picked up automatically.
        - ohvara_ios
      vars:
        BUNDLE_ID: com.ohvara.portal
        # The app's Apple ID (App Store Connect → the app → App Information).
        APP_STORE_APPLE_ID: "6824336893"
        # The app ships this same build inside it; no over-the-air zip needed.
        OTA_SKIP: "1"
        # P951: "1" in the ios-submit workflow only. TestFlight-only is the default.
        SUBMIT_TO_APP_STORE: "0"
      node: 22
      xcode: latest
    scripts: &ios_scripts
      - name: Install
        script: npm ci
      - name: Build the portal
        script: npm run build
      - name: Copy it into the iPhone project
        script: npx cap sync ios
      # P951: automatic signing. No profile is uploaded to Codemagic any more; the
      # profile is made fresh from Apple's current capabilities on every build.
      - name: Signing key present
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is missing. Codemagic > Teams > Global variables and secrets (or the app's Environment variables) > group ohvara_ios > add CERTIFICATE_PRIVATE_KEY (secret) = the contents of ios_distribution_private_key."
            echo "Steps: brain/App Store Launch Checklist.md > Automatic iOS signing."
            exit 1
          fi
      - name: Set up the keychain
        script: keychain initialize
      - name: Fetch signing files from Apple
        script: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          app-store-connect fetch-signing-files "$BUNDLE_ID"             --type IOS_APP_STORE             --profiles-dir "$HOME/Library/MobileDevice/Provisioning Profiles"             --create
      - name: Add the certificate to the keychain
        script: keychain add-certificates
      - name: Signing profiles
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      # P928: build 4 carries the Time Sensitive entitlement (P880 live-transfer
      # alerts). Safety net since P951: the profile is fetched fresh now, so this only
      # fails when the capability is not ticked on the App ID itself.
      - name: Profile has Time Sensitive
        script: |
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision; do
            [ -f "$f" ] || continue
            if security cms -D -i "$f" 2>/dev/null | grep -q "com.ohvara.portal" && security cms -D -i "$f" 2>/dev/null | grep -q "usernotifications.time-sensitive"; then
              echo "Profile OK: $(basename "$f")"; exit 0
            fi
          done
          echo "The App Store profile Apple just made for com.ohvara.portal has no Time Sensitive Notifications."
          echo "Fix: developer.apple.com > Identifiers > com.ohvara.portal > tick Time Sensitive Notifications > Save. Then start the build again (the profile is remade on its own)."
          exit 1
      - name: Next build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "Build $NEXT"
      - name: Build the .ipa
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
      # P951: only does anything in the ios-submit workflow (SUBMIT_TO_APP_STORE=1):
      # uploads the build and sends version for App Review with What's New from
      # app-store/whats-new.txt. Release stays MANUAL.
      - name: Upload and submit for App Review (ios-submit only)
        script: |
          if [ "$SUBMIT_TO_APP_STORE" != "1" ]; then
            echo "TestFlight only: the build is uploaded by the publishing step below."; exit 0
          fi
          app-store-connect publish             --path build/ios/ipa/*.ipa             --testflight             --app-store             --cancel-previous-submissions             --release-type MANUAL             --locale en-US             --whats-new "$(cat app-store/whats-new.txt)"
    artifacts: &ios_artifacts
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # P951: same build, then sent for App Review. Start it only with Brayden's yes
  # (scripts/app/build.mjs ios --submit). Release stays manual: after approval,
  # Release in App Store Connect.
  ios-submit:
    name: iPhone → TestFlight + App Review
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Ohvara ASC key
    environment:
      groups:
        - ohvara_web
        - ohvara_ios
      vars:
        BUNDLE_ID: com.ohvara.portal
        APP_STORE_APPLE_ID: "6824336893"
        OTA_SKIP: "1"
        SUBMIT_TO_APP_STORE: "1"
      node: 22
      xcode: latest
    scripts: *ios_scripts
    artifacts: *ios_artifacts

  android-internal:
    name: Android → Play internal testing
    # The free Personal plan only allows the Mac; it has the Android SDK too.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: &android_env
      groups:
        - ohvara_web
        - google_play
      android_signing:
        - ohvara_upload
      vars:
        PACKAGE_NAME: com.ohvara.portal
        OTA_SKIP: "1"
      node: 22
      # Capacitor 8 compiles with Java 21 (android/app/capacitor.build.gradle).
      java: 21
    scripts: &android_scripts
      - name: Install
        script: npm ci
      - name: Build the portal
        script: npm run build
      - name: Copy it into the Android project
        script: npx cap sync android
      - name: Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Firebase file (push)
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase file added"
          else
            # P928: push is on for Android builds 1+ (public/app/config.json), and
            # push without this file crashes the app, so no build ships without it.
            echo "GOOGLE_SERVICES_JSON is missing from the google_play group: stopping (push would crash the app)"
            exit 1
          fi
      - name: Build the .aab
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          echo "Build $NEXT"
          cd android && chmod +x gradlew && ./gradlew bundleRelease -PversionCode=$NEXT
    artifacts: &android_artifacts
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Required until the app has been published once.
        submit_as_draft: true

  # P928: the Play account is a personal one, so production needs 12+ testers
  # opted in to a closed test for 14 days in a row first. Same build as above,
  # sent to the closed track ("alpha" = Closed testing in the Play Console).
  # Lands as a draft: Play Console > Closed testing > the release > Start rollout.
  android-closed:
    name: Android → Play closed testing
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: *android_env
    scripts: *android_scripts
    artifacts: *android_artifacts
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha
        submit_as_draft: true
