<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080810" />
  <title>Get the Ohvara app</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Prompt 775 — the one link people share for the phone app. An iPhone
       goes straight to the App Store, an Android to Google Play; anything
       else sees both badges and the QR code. Store links live in
       /app/config.json (null = "Coming soon"). No framework, no tracking. -->
  <style>
    :root { --bg: #080810; --card: #12131C; --line: rgba(255,255,255,0.08); --hi: #F5F6FA; --mute: #A3A8B8; --teal: #00BFA6; --btn-text: #080810; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #EEF2F3; --card: #FFFFFF; --line: rgba(2,79,70,0.12); --hi: #0B0D14; --mute: #4B5563; --teal: #00917D; --btn-text: #FFFFFF; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: var(--bg); color: var(--hi); font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 24px; text-align: center; }
    .mark { width: 56px; height: 56px; border-radius: 16px; display: inline-block; }
    h1 { margin: 16px 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--mute); font-size: 15px; line-height: 1.5; }
    .qr { margin: 22px auto 8px; width: 200px; height: 200px; border-radius: 14px; overflow: hidden; background: #FFFFFF; }
    .qr img { width: 100%; height: 100%; display: block; }
    .stores { display: flex; gap: 10px; margin-top: 18px; }
    .stores a { flex: 1; height: 48px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
      background: var(--teal); color: var(--btn-text); font-weight: 700; font-size: 15px; text-decoration: none; }
    .soon { margin-top: 18px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); font-size: 14px; color: var(--mute); }
    .soon a { color: var(--teal); font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/pwa-192.png" alt="" />
    <h1>Get the Ohvara app</h1>
    <p id="lede">Your Ohvara portal on your phone, with alerts.</p>
    <div class="qr" id="qr"><img src="/app/qr.svg" alt="QR code for this page" /></div>
    <p id="scan">Point your phone's camera at the code.</p>
    <div class="stores" id="stores" hidden>
      <a id="ios" href="#" hidden>App Store</a>
      <a id="android" href="#" hidden>Google Play</a>
    </div>
    <div class="soon" id="soon" hidden>Coming soon to the App Store and Google Play. For now, <a href="/">open the portal</a>.</div>
  </main>
  <script>
    (function () {
      var ua = navigator.userAgent || ''
      var iPad = ua.indexOf('Macintosh') > -1 && navigator.maxTouchPoints > 1
      var isIOS = /iPhone|iPad|iPod/.test(ua) || iPad
      var isAndroid = /Android/i.test(ua)
      function show(id, on) { document.getElementById(id).hidden = !on }
      function safe(u) { return typeof u === 'string' && /^https:\/\/(apps\.apple\.com|play\.google\.com)\//.test(u) ? u : null }
      fetch('/app/config.json', { cache: 'no-cache' }).then(function (r) { return r.json() }).catch(function () { return {} }).then(function (cfg) {
        var ios = safe(cfg.ios), android = safe(cfg.android)
        if (isIOS && ios) { location.replace(ios); return }
        if (isAndroid && android) { location.replace(android); return }
        var phone = isIOS || isAndroid
        show('qr', !phone); show('scan', !phone)
        if (ios) { document.getElementById('ios').href = ios; show('ios', !isAndroid) }
        if (android) { document.getElementById('android').href = android; show('android', !isIOS) }
        show('stores', !!(ios || android))
        show('soon', !(ios || android))
      })
    })()
  </script>
</body>
</html>
