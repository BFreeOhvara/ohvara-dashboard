<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Prompt 722 — the bird without its box; the SVG swaps its navy wing to
         white in a dark browser tab. PNG fallback for browsers without SVG
         icons. og:image below stays on the boxed ohvara-favicon.png. -->
    <link rel="icon" type="image/svg+xml" href="/ohvara-mark-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/ohvara-favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080810" />
    <!-- Prompt 662 — installable icon only; deliberately no service worker. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>Ohvara Portal</title>
    <!-- P996: signed-out pages open light (like ohvara.com) unless a theme was saved, from the very first paint,
         so a click from the website never shows a dark frame first. src/hooks/useTheme.js makes the same call. -->
    <script>
      (function () {
        var saved = null
        try { saved = localStorage.getItem('ohvara-theme') } catch (e) {}
        if (!saved && /^\/(login|signup|join|j|reset-password|confirm-email)(\/|$)/.test(location.pathname)) {
          document.documentElement.setAttribute('data-theme', 'light')
          document.documentElement.style.background = '#ECECE7'
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#ECECE7')
        }
      })()
    </script>

    <!-- Open Graph / link-unfurl preview (Prompt 294 Part A). Static: this is
         a client-rendered SPA, so bots that don't run JS see these tags for
         every route. Prompt 781: kept neutral (these also front the /r/
         reschedule links clients get); invite links (/join, /j/*) are served
         dist/join.html instead, with their own "You're invited" card
         (scripts/vite-join-og.mjs). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ohvara" />
    <meta property="og:title" content="Ohvara" />
    <meta property="og:description" content="Ohvara Portal" />
    <meta property="og:image" content="https://portal.ohvara.com/ohvara-favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ohvara" />
    <meta name="twitter:description" content="Ohvara Portal" />
    <meta name="twitter:image" content="https://portal.ohvara.com/ohvara-favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
