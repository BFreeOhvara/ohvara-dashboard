<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Prompt 722 — the bird without its box; the SVG swaps its navy wing to
         white in a dark browser tab. PNG fallback for browsers without SVG
         icons. og:image below stays on the boxed ohvara-favicon.png. -->
    <link rel="icon" type="image/svg+xml" href="/ohvara-mark-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/ohvara-favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080810" />
    <!-- Prompt 662 — installable icon only; deliberately no service worker. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>Ohvara Portal</title>
    <!-- P996 + P1021: the theme is decided here, before the first paint, and set on <html data-theme> every time, so the
         loading screen, the app intro, sign-in and the portal all open in the same one. The call: the saved choice
         (light / dark / system); with nothing saved, the signed-out pages open light (like ohvara.com) and everywhere
         else follows the device's setting. src/hooks/useTheme.js makes the same call; public/intro.js reads the result. -->
    <script>
      (function () {
        var saved = null
        try { saved = localStorage.getItem('ohvara-theme') } catch (e) {}
        var sysLight = !!(window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches)
        var pub = /^\/(login|signup|join|j|reset-password|confirm-email)(\/|$)/.test(location.pathname)
        var light
        if (saved === 'light') light = true
        else if (saved === 'dark') light = false
        else if (saved === 'system') light = sysLight
        else light = pub || sysLight
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark')
        if (light) {
          if (!saved && pub) document.documentElement.style.background = '#ECECE7'
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#ECECE7')
        }
      })()
    </script>
    <!-- P1028: phone app only, cold start only. The page stays the splash's navy until public/intro.js has painted
         its first frame over it, so hiding the native splash can never show the light/dark page (the white flash).
         intro.js takes the class off under its own overlay; nativeBoot.js and the 5 s timer are backstops. A reload
         after the intro (the over-the-air update switching in) is not a cold start and keeps the theme's background. -->
    <style>html.oi-boot,html.oi-boot body{background:#0A1F44!important}</style>
    <script>
      (function () {
        var C = window.Capacitor
        if (!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return
        var at = null
        try { at = Number(sessionStorage.getItem('ohvara-intro-at')) || null } catch (e) {}
        if (at && Date.now() - at >= 2150) return
        var h = document.documentElement
        h.classList.add('oi-boot')
        setTimeout(function () { h.classList.remove('oi-boot') }, 5000)
      })()
    </script>
    <!-- P1020: the loading screen's look (src/components/shared/Loader.jsx). Here, not in the bundle, so the first
         paint can show it (#ol-boot below) before any script has loaded. The only colours it uses sit on .ol. -->
    <style id="ol-css">
      .ol{--ol-bg:linear-gradient(160deg,#2B3238 0%,#1A1F23 55%,#13171A 100%);--ol-body:#00BFA6;--ol-wing:#FFFFFF;--ol-line:#00BFA6;--ol-track:rgba(255,255,255,.14);--ol-word:#A3ACB3;
        position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
        background:var(--ol-bg);opacity:0;transition:opacity .2s ease;pointer-events:none;-webkit-tap-highlight-color:transparent}
      :root[data-theme="light"] .ol{--ol-bg:linear-gradient(135deg,#C9D7E8 0%,#E6E9E6 45%,#EFE3D3 100%);--ol-body:#0A1F44;--ol-wing:#00BFA6;--ol-track:rgba(10,31,68,.12);--ol-word:#5F6B72}
      .ol.is-on{opacity:1;pointer-events:auto;animation:none}
      .ol.is-out{opacity:0;transition-duration:.22s;pointer-events:none;animation:none}
      .ol.ol-boot{animation:ol-in .2s ease .3s forwards}
      html.ol-hold #root{visibility:hidden}
      .ol-top{position:fixed;top:0;left:0;right:0;height:3px;z-index:2147482999;overflow:hidden;pointer-events:none;opacity:0;animation:ol-in .2s ease .3s forwards}
      .ol-top i{position:absolute;top:0;bottom:0;left:-40%;width:40%;border-radius:2px;background:#00BFA6;animation:ol-bar 1.3s ease-in-out infinite}
      .ol svg{display:block;width:88px;height:107px;overflow:visible}
      .ol .olb{fill:var(--ol-body)}
      .ol .olw{fill:var(--ol-wing);transform-origin:150px 245px;animation:ol-wing 1.6s cubic-bezier(.45,0,.25,1) var(--ol-t,0s) infinite}
      .ol-track{position:relative;overflow:hidden;border-radius:2px;width:170px;height:3px;background:var(--ol-track)}
      .ol-track i{position:absolute;top:0;bottom:0;left:-40%;width:40%;border-radius:2px;background:var(--ol-line);animation:ol-bar 1.3s ease-in-out var(--ol-t,0s) infinite}
      .ol-word{font:500 15px Inter,Manrope,system-ui,sans-serif;color:var(--ol-word);letter-spacing:.2px;animation:ol-fade 1.6s ease-in-out var(--ol-t,0s) infinite}
      .ol.ol-phone svg{width:72px;height:87px}
      .ol.ol-phone .ol-track{width:120px}
      .ol.ol-phone .ol-word{display:none}
      @keyframes ol-in{to{opacity:1;pointer-events:auto}}
      @keyframes ol-wing{0%,100%{transform:rotate(0deg)}45%{transform:rotate(-9deg)}60%{transform:rotate(-7deg)}}
      @keyframes ol-bar{0%{left:-40%}100%{left:100%}}
      @keyframes ol-fade{0%,100%{opacity:.55}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.ol .olw,.ol-word{animation:none}.ol-top i{animation:none;left:0;width:100%;opacity:.7}}
    </style>

    <!-- Open Graph / link-unfurl preview (Prompt 294 Part A). Static: this is
         a client-rendered SPA, so bots that don't run JS see these tags for
         every route. Prompt 781: kept neutral (these also front the /r/
         reschedule links clients get); invite links (/join, /j/*) are served
         dist/join.html instead, with their own "You're invited" card
         (scripts/vite-join-og.mjs). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ohvara" />
    <meta property="og:title" content="Ohvara" />
    <meta property="og:description" content="Ohvara Portal" />
    <meta property="og:image" content="https://portal.ohvara.com/ohvara-favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ohvara" />
    <meta name="twitter:description" content="Ohvara Portal" />
    <meta name="twitter:image" content="https://portal.ohvara.com/ohvara-favicon.png" />
  </head>
  <body>
    <!-- P1010: the phone app's ~2 s logo reveal on a cold start (public/intro.js). Only inside the app;
         the website never downloads it. It runs before the bundle so the first frame is the splash's navy. -->
    <script>
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) document.write('<script src="/intro.js"><\/script>')
    </script>
    <!-- P1020: the first loading screen, painted before the bundle (shows only if loading passes 300 ms). main.jsx hands
         it to Loader.jsx, which takes it over or fades it out. The mark must match Loader.jsx (loader.test.js). -->
    <div id="root"><div id="ol-boot" class="ol ol-boot" role="status" aria-label="Loading"><svg viewBox="0 0 291.4 354" aria-hidden="true"><path class="olb" d="M54 352 L52 353 L66 339 L88 314 L115 281 L154 223 L188 162 L220 94 L231 67 L237 50 L240 41 L244 31 L247 22 L249 17 L254 2 L255 52 L250 171 L248 205 L247 230 L289 251 L279 257 L264 264 L239 274 L224 280 L201 290 L193 294 L161 307 L141 316 L116 326 L108 330 L97 334 L89 338 L71 345 L54 352 Z"/><path class="olw" d="M73 296 L72 296 L72 274 L68 236 L58 203 L43 171 L21 137 L1 114 L7 116 L41 132 L111 163 L125 170 L164 187 L172 190 L173 188 L175 189 L175 193 L174 196 L171 200 L170 203 L167 207 L166 210 L163 214 L162 217 L159 221 L157 225 L154 229 L152 233 L148 238 L141 243 L142 240 L145 235 L73 296 Z"/></svg><div class="ol-track" aria-hidden="true"><i></i></div><div class="ol-word">Loading</div></div></div>
    <script>
      (function () {
        var b = document.getElementById('ol-boot')
        var app = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
        if (b && (app || (window.matchMedia && window.matchMedia('(max-width: 767.98px)').matches))) b.className += ' ol-phone'
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
